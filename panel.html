<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { 
      margin: 0; padding: 0; 
      width: 100%; height: 100vh; 
      display: flex; flex-direction: column; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: #fff; overflow: hidden; 
    }
    
    /* 顶部输入框 (默认显示，自动模式下隐藏) */
    .nav-container { 
      padding: 12px; background-color: #fff; border-bottom: 1px solid #eee; 
      flex-shrink: 0; display: block; 
    }
    #urlInput { 
      width: 100%; padding: 10px 12px; font-size: 14px; 
      background-color: #f5f6f7; border: 1px solid transparent; border-radius: 6px; 
      outline: none; box-sizing: border-box; transition: all 0.2s; 
    }
    #urlInput:focus { 
      background-color: #fff; border-color: #3370ff; box-shadow: 0 0 0 2px rgba(51,112,255,0.2); 
    }
    
    /* 🌟 漂亮的欢迎页样式 */
    #welcome-screen { 
      flex: 1; display: flex; flex-direction: column; 
      align-items: center; padding: 20px; 
      overflow-y: auto; /* 允许小屏幕滚动 */
      background: linear-gradient(180deg, #fff 0%, #f9fafb 100%); 
    }
    
    /* 图片容器 */
    .img-box { margin-bottom: 24px; margin-top: 20px; }
    .img-box img { 
      width: 180px; height: auto; display: block; 
      border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); 
    }
    
    .welcome-title { font-size: 20px; font-weight: 700; color: #1f2329; margin-bottom: 8px; }
    .welcome-desc { font-size: 14px; color: #646a73; margin-bottom: 30px; text-align: center; }
    
    /* 功能列表 */
    .feature-list { 
      background: #fff; border: 1px solid #eee; border-radius: 12px; 
      padding: 16px; width: 90%; max-width: 320px; box-sizing: border-box; 
    }
    .feature-item { 
      display: flex; align-items: flex-start; margin-bottom: 16px; font-size: 13px; color: #333; 
    }
    .feature-item:last-child { margin-bottom: 0; }
    .f-icon { margin-right: 10px; font-size: 16px; line-height: 1.3; }
    .f-text b { display: block; margin-bottom: 2px; color: #1f2329; }
    .f-text span { color: #8f959e; font-size: 12px; }

    /* 网页容器 */
    iframe { flex: 1; border: none; width: 100%; height: 100%; display: none; background: #fff; }
  </style>
</head>
<body>

  <div class="nav-container" id="navBox">
    <input type="text" id="urlInput" placeholder="输入网址，回车访问..." autocomplete="off">
  </div>

  <div id="welcome-screen">
    <div class="img-box">
      <img src="welcome.png" alt="Welcome">
    </div>
    
    <div class="welcome-title">绩效助手</div>
    <div class="welcome-desc">您的智能分屏协作专家</div>

    <div class="feature-list">
      <div class="feature-item">
        <div class="f-icon">⚡️</div>
        <div class="f-text"><b>智能拦截</b><span>点击绩效/Wiki链接，自动分屏打开</span></div>
      </div>
      <div class="feature-item">
        <div class="f-icon">📖</div>
        <div class="f-text"><b>沉浸阅读</b><span>自动收起输入框，专注内容本身</span></div>
      </div>
      <div class="feature-item">
        <div class="f-icon">🖥️</div>
        <div class="f-text"><b>一键挂起</b><span>点击插件图标，当前页移至侧边</span></div>
      </div>
    </div>
  </div>

  <iframe id="webView" src=""></iframe>

  <script src="panel.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">绩效助手把页面链接交给侧边栏</title>
  <desc id="desc">绩效页面中的目标链接经过插件进入侧边栏，同时保持绩效系统可访问。</desc>
  <rect width="1200" height="675" fill="#fff"/>
  <text x="96" y="92" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111">目标链接进入侧边栏，当前页面保持可用</text>
  <text x="96" y="128" font-family="Arial, sans-serif" font-size="16" fill="#666">绩效页面 → 目标链接 → 侧边栏 → 绩效系统</text>
  <line x1="136" y1="360" x2="1064" y2="360" stroke="#222" stroke-width="1.5"/>
  <circle cx="230" cy="360" r="12" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <circle cx="470" cy="360" r="12" fill="#2F6BFF"/>
  <rect x="650" y="292" width="190" height="136" fill="#F5F5F5" stroke="#222"/>
  <line x1="840" y1="360" x2="1000" y2="360" stroke="#2F6BFF" stroke-width="1.5"/>
  <path d="M1000 360 l-12 -7 v14 z" fill="#2F6BFF"/>
  <text x="230" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111">绩效页面</text>
  <text x="470" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111">目标链接</text>
  <text x="745" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111">侧边栏</text>
  <text x="745" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">并行打开</text>
  <text x="1000" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#111">绩效系统</text>
</svg>
